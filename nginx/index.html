<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello from nginx on JetDeploy</title>

  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #f8fafc;
    }

    .card {
      width: min(720px, 90vw);
      padding: 40px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.16);
    }

    .badge {
      display: inline-block;
      margin-bottom: 20px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.18);
      color: #7dd3fc;
      font-size: 14px;
      font-weight: 600;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(32px, 5vw, 48px);
      line-height: 1.05;
    }

    p {
      margin: 0 0 24px;
      color: #cbd5e1;
      font-size: 18px;
      line-height: 1.6;
    }

    code {
      padding: 3px 7px;
      border-radius: 6px;
      background: rgba(15, 23, 42, 0.8);
      color: #bae6fd;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="badge">JetDeploy example: nginx</div>

    <h1>Static site, served by nginx</h1>

    <p>
      This page is served by <code>nginx</code> on port <code>8080</code>,
      the port JetDeploy expects for the app's process.
      Replace this file and <code>default.conf</code> with your own static site.
    </p>
  </main>
</body>
</html>
